<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { margin: 0; background: #fff; font-family: sans-serif; }
  .row { display: flex; gap: 24px; align-items: end; padding: 24px; }
  .cell { text-align: center; }
  .label { font-size: 12px; color: #666; margin-top: 6px; }
  .swatch { display: inline-flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
  <div class="row" style="background:#fff">
    <div class="cell"><div class="swatch" style="width:16px;height:16px"><img src="favicon.svg" width="16" height="16" /></div><div class="label">16 light</div></div>
    <div class="cell"><div class="swatch" style="width:32px;height:32px"><img src="favicon.svg" width="32" height="32" /></div><div class="label">32</div></div>
    <div class="cell"><div class="swatch" style="width:64px;height:64px"><img src="favicon.svg" width="64" height="64" /></div><div class="label">64</div></div>
  </div>
  <div class="row" style="background:#2c2c2e">
    <div class="cell"><img src="favicon.svg" width="16" height="16" /><div class="label" style="color:#aaa">16 dark</div></div>
    <div class="cell"><img src="favicon.svg" width="32" height="32" /></div>
  </div>
  <div class="row" style="background:#F5F5F7">
    <div class="cell"><img src="favicon.svg" width="16" height="16" /><div class="label">16 gray</div></div>
    <div class="cell"><img src="favicon.svg" width="32" height="32" /></div>
    <div class="cell"><img src="favicon.svg" width="180" height="180" /><div class="label">180</div></div>
  </div>
</body>
</html>
